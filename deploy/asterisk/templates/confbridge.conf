; Conferences of the simulated pharmacies (extensions.conf, [sim-attendant]): the caller (the
; Recuidado AI) and the actor (the attendant AI). The call ends when the actor leaves.
[general]

[sim_bridge]
type=bridge

[sim_caller]
type=user
quiet=yes
wait_marked=yes
end_marked=yes
music_on_hold_when_empty=no

[sim_actor]
type=user
quiet=yes
marked=yes
