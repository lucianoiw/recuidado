[general]
static=yes
writeprotect=yes

[globals]
ALLOWED=${ALLOWED_REGEX}
NVOIP_HOST=${NVOIP_SIP_HOST}

; GPT-Live dials +55DDNNNNNNNNN. Nvoip expects DDD + number, without 0 or country code.
[from-openai]
exten => _+55XXXXXXXXX.,1,NoOp(Reminder call to ${EXTEN})
 same => n,Set(NUM=${EXTEN:3})
 same => n,GotoIf($[${REGEX("${GLOBAL(ALLOWED)}" ${NUM})}]?dial)
 same => n,NoOp(Blocked destination ${NUM})
 same => n,Hangup(21)
 same => n(dial),Dial(PJSIP/nvoip/sip:${NUM}@${GLOBAL(NVOIP_HOST)},60)
 same => n,Hangup()

; Logs who ended the call and why, to debug calls cut short.
exten => h,1,Verbose(1,Call ended: dialstatus=${DIALSTATUS} cause=${HANGUPCAUSE} source=${CHANNEL(hangupsource)} answered=${ANSWEREDTIME}s)

exten => _X.,1,Hangup(21)

; No inbound calls are handled.
[from-nvoip]
exten => _X.,1,Hangup(21)
