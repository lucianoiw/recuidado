[general]
static=yes
writeprotect=yes

[globals]
ALLOWED=${ALLOWED_REGEX}
NVOIP_HOST=${NVOIP_SIP_HOST}

; GPT-Live dials +55DDNNNNNNNNN. Nvoip expects DDD + number, without 0 or country code.
[from-openai]
; Test pharmacies, answered here and never dialed out (DDD 00 does not exist in Brazil).
; They test the pharmacy call end to end (DTMF included) without calling a third party.
; List them in CALL_ALLOWED_NUMBERS of apps/voice and set PHARMACY_CALL_PHONE to one of them.
;   +5500000000000  menu, key 2, attendant
;   +5500000000001  menu, key 2, hold message and music, then the attendant
;   +5500000000002  a person who says "só um minuto", comes back after a while
;   +5500000000003  a person answers directly, no menu
;   +5500000000004  closed: recorded opening hours, then hangs up
exten => +5500000000000,1,Gosub(remember-channel,s,1(${EXTEN:3}))
 same => n,Goto(ura-test,s,1)
exten => +5500000000001,1,Gosub(remember-channel,s,1(${EXTEN:3}))
 same => n,Goto(ura-hold,s,1)
exten => +5500000000002,1,Gosub(remember-channel,s,1(${EXTEN:3}))
 same => n,Goto(person-wait,s,1)
exten => +5500000000003,1,Gosub(remember-channel,s,1(${EXTEN:3}))
 same => n,Goto(person-direct,s,1)
exten => +5500000000004,1,Gosub(remember-channel,s,1(${EXTEN:3}))
 same => n,Goto(closed,s,1)

;   +550000000001N (N = 1 to 3)  simulated pharmacies for the demo video, see [sim-attendant]
exten => _+550000000001[1-3],1,Gosub(remember-channel,s,1(${EXTEN:3}))
 same => n,Set(SIM=${EXTEN:-1})
 same => n,Set(GLOBAL(SIM_READY_${SIM})=0)
 same => n,Set(GLOBAL(SIM_ACTOR_${SIM})=0)
 same => n,Verbose(1,Sim pharmacy ${SIM}: answered)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(sim-${SIM},s,1)
; The second AI that plays the attendant of simulated pharmacy N (recuidado/voice dials it).
exten => _+550000000009[1-3],1,Set(SIM=${EXTEN:-1})
 same => n,Goto(sim-actor,s,1)

exten => _+55XXXXXXXXX.,1,NoOp(Reminder call to ${EXTEN})
 same => n,Set(NUM=${EXTEN:3})
 same => n,Gosub(remember-channel,s,1(${NUM}))
 same => n,GotoIf($[${REGEX("${GLOBAL(ALLOWED)}" ${NUM})}]?dial)
 same => n,NoOp(Blocked destination ${NUM})
 same => n,Hangup(21)
 same => n(dial),Dial(PJSIP/nvoip/sip:${NUM}@${GLOBAL(NVOIP_HOST)},60)
 same => n,Hangup()

; Logs who ended the call and why, to debug calls cut short.
exten => h,1,Verbose(1,Call ended: dialstatus=${DIALSTATUS} cause=${HANGUPCAUSE} source=${CHANNEL(hangupsource)} answered=${ANSWEREDTIME}s)

exten => _X.,1,Hangup(21)

;; Which channel carries the AI, by the number it dialed (DDD + number), so recuidado/voice can
;; mute what the AI says to the other side through AMI (MuteAudio) without muting what it hears.
[remember-channel]
exten => s,1,Set(GLOBAL(AI_CHANNEL_${ARG1})=${CHANNEL})
 same => n,Return()

; The attendant of every test pharmacy: waits for the assistant like a person would, answers, says bye.
[test-attendant]
exten => s,1,Playback(/opt/recuidado/sounds/ura-attendant)
 ; Like a real person: if nobody answers the greeting, say "Alô?" once more.
 same => n,WaitForNoise(200,1,4)
 same => n,GotoIf($["${WAITSTATUS}" != "TIMEOUT"]?talk)
 same => n,Verbose(1,Attendant: silence after greeting, saying alo)
 same => n,Playback(/opt/recuidado/sounds/ura-hello)
 same => n,WaitForNoise(200,1,10)
 same => n(talk),WaitForSilence(1500,1,15)
 same => n,Playback(/opt/recuidado/sounds/ura-answer)
 same => n,WaitForNoise(200,1,10)
 same => n,WaitForSilence(1500,1,15)
 same => n,Playback(/opt/recuidado/sounds/ura-bye)
 same => n,Wait(3)
 same => n,Hangup()

[ura-test]
exten => s,1,Verbose(1,URA test: answered)
 same => n,Answer()
 same => n,Wait(1)
 same => n(menu),Set(TIMEOUT(digit)=3)
 same => n,Background(/opt/recuidado/sounds/ura-menu)
 same => n,WaitExten(10)

; The option a pharmacy call should pick: a recorded "attendant" answers stock and price.
exten => 2,1,Verbose(1,URA test: pressed 2 (right option))
 same => n,Goto(test-attendant,s,1)

exten => _[0-9*#],1,Verbose(1,URA test: pressed ${EXTEN} (wrong option))
 same => n,Playback(/opt/recuidado/sounds/ura-wrong)
 same => n,Goto(s,menu)

exten => t,1,Verbose(1,URA test: no key pressed)
 same => n,Goto(s,menu)

exten => i,1,Goto(s,menu)

exten => h,1,Verbose(1,URA test ended after ${CDR(billsec)}s)

; Menu, then a hold message with music before the attendant picks up.
[ura-hold]
exten => s,1,Verbose(1,URA hold: answered)
 same => n,Answer()
 same => n,Wait(1)
 same => n(menu),Set(TIMEOUT(digit)=3)
 same => n,Background(/opt/recuidado/sounds/ura-menu)
 same => n,WaitExten(10)

exten => 2,1,Verbose(1,URA hold: pressed 2, holding)
 same => n,Playback(/opt/recuidado/sounds/hold-message)
 same => n,Playback(/opt/recuidado/sounds/hold-music)
 same => n,Playback(/opt/recuidado/sounds/hold-message)
 same => n,Playback(/opt/recuidado/sounds/hold-music)
 same => n,Verbose(1,URA hold: attendant picks up)
 same => n,Goto(test-attendant,s,1)

exten => _[0-9*#],1,Verbose(1,URA hold: pressed ${EXTEN} (wrong option))
 same => n,Playback(/opt/recuidado/sounds/ura-wrong)
 same => n,Goto(s,menu)
exten => t,1,Goto(s,menu)
exten => i,1,Goto(s,menu)
exten => h,1,Verbose(1,URA hold ended after ${CDR(billsec)}s)

; A person answers, asks to wait, and comes back.
[person-wait]
exten => s,1,Verbose(1,Person wait: answered)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(/opt/recuidado/sounds/person-wait)
 same => n,Wait(12)
 same => n,Verbose(1,Person wait: back)
 same => n,Playback(/opt/recuidado/sounds/person-back)
 same => n,Goto(test-attendant,s,talk)
exten => h,1,Verbose(1,Person wait ended after ${CDR(billsec)}s)

; A person answers directly, no menu.
[person-direct]
exten => s,1,Verbose(1,Person direct: answered)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(test-attendant,s,1)
exten => h,1,Verbose(1,Person direct ended after ${CDR(billsec)}s)

; The pharmacy is closed: a recording with the opening hours, then it hangs up.
[closed]
exten => s,1,Verbose(1,Closed: answered)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(/opt/recuidado/sounds/closed)
 same => n,Wait(2)
 same => n,Hangup()
exten => h,1,Verbose(1,Closed ended after ${CDR(billsec)}s)

;; Simulated pharmacies for the demo: every phone menu here is real (DTMF, hold), and the attendant is
;; a second GPT-Live session with another voice. When the caller gets past the menu, the line rings;
;; recuidado/voice sees SIM_READY_N through AMI and dials the actor, which joins a conference with
;; the caller. Prices come from the actor's instructions, different in each pharmacy.

; Drogaria Vida: menu, key 2, attendant.
[sim-1]
exten => s,1,Set(TIMEOUT(digit)=3)
 same => n(menu),Background(/opt/recuidado/sounds/sim1-menu)
 same => n,WaitExten(10)
exten => 2,1,Verbose(1,Sim pharmacy 1: pressed 2)
 same => n,Goto(sim-attendant,s,1)
exten => _[013-9*#],1,Verbose(1,Sim pharmacy 1: pressed ${EXTEN} (wrong option))
 same => n,Playback(/opt/recuidado/sounds/ura-wrong)
 same => n,Goto(s,menu)
exten => t,1,Goto(s,menu)
exten => i,1,Goto(s,menu)

; Farmácia Central: a person answers directly.
[sim-2]
exten => s,1,Goto(sim-attendant,s,1)

; Drogaria Bom Preço: menu, key 3, a hold message with music, then the attendant.
[sim-3]
exten => s,1,Set(TIMEOUT(digit)=3)
 same => n(menu),Background(/opt/recuidado/sounds/sim3-menu)
 same => n,WaitExten(10)
exten => 3,1,Verbose(1,Sim pharmacy 3: pressed 3, holding)
 same => n,Playback(/opt/recuidado/sounds/hold-message)
 same => n,Playback(/opt/recuidado/sounds/hold-music)
 same => n,Goto(sim-attendant,s,1)
exten => _[0-24-9*#],1,Verbose(1,Sim pharmacy 3: pressed ${EXTEN} (wrong option))
 same => n,Playback(/opt/recuidado/sounds/ura-wrong)
 same => n,Goto(s,menu)
exten => t,1,Goto(s,menu)
exten => i,1,Goto(s,menu)

; The caller reaches the attendant: the line rings (up to 30 s) until the actor picks up.
[sim-attendant]
exten => s,1,Verbose(1,Sim pharmacy ${SIM}: ringing the attendant)
 same => n,Set(GLOBAL(SIM_READY_${SIM})=1)
 same => n,Set(I=0)
 ; Brazilian ringback: 425 Hz, one second on, four off (no indications.conf here).
 same => n,Playtones(425/1000,0/4000)
 same => n(wait),GotoIf($["${GLOBAL(SIM_ACTOR_${SIM})}" = "1"]?talk)
 same => n,Set(I=$[${I} + 1])
 same => n,GotoIf($[${I} > 100]?giveup)
 same => n,Wait(0.3)
 same => n,Goto(wait)
 same => n(talk),StopPlaytones()
 same => n,Set(GLOBAL(SIM_READY_${SIM})=0)
 same => n,ConfBridge(sim${SIM},sim_bridge,sim_caller)
 same => n,Hangup()
 same => n(giveup),Verbose(1,Sim pharmacy ${SIM}: the attendant never picked up)
 same => n,Set(GLOBAL(SIM_READY_${SIM})=0)
 same => n,Hangup()
exten => h,1,Verbose(1,Sim pharmacy ${SIM} ended after ${CDR(billsec)}s)
 same => n,Set(GLOBAL(SIM_READY_${SIM})=0)

; The actor's call: answered at once. GPT-Live greets when the call is answered.
[sim-actor]
exten => s,1,Verbose(1,Sim pharmacy ${SIM}: actor picks up)
 same => n,Answer()
 same => n,Set(GLOBAL(SIM_ACTOR_${SIM})=1)
 same => n,ConfBridge(sim${SIM},sim_bridge,sim_actor)
 same => n,Hangup()
exten => h,1,Set(GLOBAL(SIM_ACTOR_${SIM})=0)

; No inbound calls are handled.
[from-nvoip]
exten => _X.,1,Hangup(21)
