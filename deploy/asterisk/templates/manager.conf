; Asterisk Manager Interface (AMI): lets recuidado/voice mute what the AI says to the
; other side (MuteAudio) while a recorded menu or hold message plays, without muting
; what the AI hears. Only private networks (the Docker network of the voice container)
; may log in; port 5038 is not opened on the VPS firewall.
[general]
enabled = ${AMI_ENABLED}
port = 5038
bindaddr = 0.0.0.0

[recuidado]
secret = ${AMI_SECRET}
deny = 0.0.0.0/0.0.0.0
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = system,call
write = system,call
