[global]
type=global
user_agent=Recuidado
; OpenAI's INVITE From user is the caller number, so its endpoint is found by the digest username.
endpoint_identifier_order=auth_username,username,ip

; ---------------------------------------------------------------- transports
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:${SIP_TLS_PORT}
cert_file=/etc/asterisk/keys/sip.crt
priv_key_file=/etc/asterisk/keys/sip.key
method=tlsv1_2
${EXTERNAL_ADDR_LINES}

[transport-udp-nvoip]
type=transport
protocol=udp
bind=0.0.0.0:${NVOIP_LOCAL_PORT}
${EXTERNAL_ADDR_LINES}

; ---------------------------------------------------------------- OpenAI GPT-Live
[openai]
type=endpoint
transport=transport-tls
context=from-openai
identify_by=auth_username,username
auth=openai-auth
aors=openai
disallow=all
allow=opus,ulaw,alaw
media_encryption=sdes
media_encryption_optimistic=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
dtmf_mode=rfc4733
timers=no

[openai-auth]
type=auth
auth_type=userpass
username=${OPENAI_SIP_USERNAME}
password=${OPENAI_SIP_PASSWORD}

[openai]
type=aor
max_contacts=0

; ---------------------------------------------------------------- Nvoip trunk
[nvoip]
type=endpoint
transport=transport-udp-nvoip
context=from-nvoip
disallow=all
allow=ulaw,alaw
outbound_auth=nvoip-auth
aors=nvoip
from_user=${NVOIP_SIP_USER}
from_domain=${NVOIP_SIP_HOST}
direct_media=no
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733
timers=no

[nvoip-auth]
type=auth
auth_type=userpass
username=${NVOIP_SIP_USER}
password=${NVOIP_SIP_PASSWORD}

[nvoip]
type=aor
contact=sip:${NVOIP_SIP_HOST}:5060
qualify_frequency=60

[nvoip-registration]
type=registration
transport=transport-udp-nvoip
outbound_auth=nvoip-auth
server_uri=sip:${NVOIP_SIP_HOST}:5060
client_uri=sip:${NVOIP_SIP_USER}@${NVOIP_SIP_HOST}
contact_user=${NVOIP_SIP_USER}
retry_interval=60

[nvoip-identify]
type=identify
endpoint=nvoip
match=${NVOIP_SIP_HOST}
